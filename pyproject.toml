[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-carson-living-electric-boogaloo"
version = "0.1.0"
description = "Home Assistant custom integration for Carson Living"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
  # TODO: switch to the PyPI package "carson-living-electric-boogaloo" once
  # lowlydba/python-carson-living's semantic-release publishes a first version.
  "carson_living @ git+https://github.com/lowlydba/python-carson-living@main",
]

[project.optional-dependencies]
test = [
  "homeassistant==2026.8.3",
  "pytest-homeassistant-custom-component==0.13.357",
  "aiohttp-cors==0.8.1",
  "requests-mock==1.12.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "coveralls==4.0.2",
  "flake8==7.1.1",
  "pylint==3.3.4",
  "PyTurboJPEG==2.5.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.carson_living" = ["*.json", "*.yaml", ".translations/*.json"]

[tool.pytest.ini_options]
addopts = "--force-enable-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = [".git"]

[tool.coverage.run]
branch = true
omit = [
  "*/__main__.py",
  "*/tests/*",
  "*/venv/*",
]

[tool.coverage.report]
omit = [
  "*/python?.?/*",
  "*/site-packages/nose/*",
  "*__init__*",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
  "too-many-arguments",
  "too-many-instance-attributes",
]
